name: CI — Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Jest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  validate:
    name: Validate Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required project files..."
          test -f index.html        && echo "✅ index.html"
          test -f README.md         && echo "✅ README.md"
          test -f CONTRIBUTING.md   && echo "✅ CONTRIBUTING.md"
          test -f SECURITY.md       && echo "✅ SECURITY.md"
          test -f package.json      && echo "✅ package.json"
          test -f package-lock.json && echo "✅ package-lock.json"
          test -f tests/calculator.test.js && echo "✅ tests/calculator.test.js"
          echo "All required files present."

      - name: Check repository size is under 10MB
        run: |
          SIZE=$(du -sb . | cut -f1)
          echo "Repo size: $SIZE bytes"
          if [ $SIZE -gt 10485760 ]; then echo "ERROR: Repo exceeds 10MB"; exit 1; fi
          echo "✅ Repo size is within 10MB limit"
